<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Pliego de prensa: planchas CMY sobreimpresas con el registro corrido
       a propósito (estética de overprint/risografía), trama de medios tonos
       y marcas de registro. Arte propio de PrintUp, no stock. -->
  <defs>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2.1" fill="#ffffff"/>
    </pattern>
    <radialGradient id="fadeDots" cx="55%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotMask"><rect width="1600" height="900" fill="url(#fadeDots)"/></mask>
    <linearGradient id="inkfall" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#0a0b0d" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0b0d" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="plateFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0b0d" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#0a0b0d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#0a0b0d"/>

  <!-- Planchas de tinta (proceso C, M, Y) -->
  <g style="mix-blend-mode:screen">
    <rect x="760" y="-90" width="600" height="1080" fill="#00aeef" opacity=".96" transform="rotate(8 1060 450)"/>
  </g>
  <g style="mix-blend-mode:screen">
    <rect x="930" y="-130" width="600" height="1160" fill="#ec008c" opacity=".9" transform="rotate(-7 1230 450)"/>
  </g>
  <g style="mix-blend-mode:screen">
    <rect x="1120" y="-70" width="540" height="1040" fill="#ffd100" opacity=".8" transform="rotate(4 1390 450)"/>
  </g>

  <!-- Trama de medios tonos sobre la zona de tinta -->
  <g mask="url(#dotMask)">
    <rect x="620" width="980" height="900" fill="url(#dots)" opacity=".4"/>
  </g>

  <!-- Velo de tinta hacia el texto y caída al pie -->
  <rect width="1600" height="900" fill="url(#plateFade)"/>
  <rect width="1600" height="900" fill="url(#inkfall)"/>

  <!-- Marcas de registro -->
  <g stroke="#ffffff" stroke-opacity=".4" stroke-width="2" fill="none">
    <g transform="translate(1470,130)"><circle r="14"/><path d="M-23 0H23M0 -23V23"/></g>
    <g transform="translate(820,760)"><circle r="10"/><path d="M-17 0H17M0 -17V17"/></g>
  </g>
  <!-- Marcas de corte en esquinas -->
  <g stroke="#ffffff" stroke-opacity=".3" stroke-width="2">
    <path d="M1540 36H1576M1564 24V60"/>
    <path d="M24 840H60M36 852V816"/>
  </g>
  <!-- Retícula técnica leve -->
  <g stroke="#ffffff" stroke-opacity=".05">
    <path d="M0 300H1600M0 600H1600M800 0V900"/>
  </g>
</svg>
